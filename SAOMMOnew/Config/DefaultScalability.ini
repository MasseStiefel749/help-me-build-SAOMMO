; Motion blur makes camera movement hard to read in the third-person test slice.
; Keep it disabled for every post-process quality level.
[PostProcessQuality@0]
r.MotionBlurQuality=0

[PostProcessQuality@1]
r.MotionBlurQuality=0

[PostProcessQuality@2]
r.MotionBlurQuality=0

[PostProcessQuality@3]
r.MotionBlurQuality=0

[PostProcessQuality@Cine]
r.MotionBlurQuality=0
